<svg width="96" height="56" viewBox="0 0 96 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bbms-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bbms-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- 外壳 -->
  <rect x="6" y="6" width="84" height="36" rx="10" fill="url(#bbms-shell)"/>
  <rect x="10" y="10" width="76" height="28" rx="8" fill="#0f172a" opacity="0.08"/>

  <!-- 中央屏幕 -->
  <rect x="18" y="14" width="40" height="16" rx="4" fill="url(#bbms-screen)"/>
  <rect x="22" y="18" width="16" height="3" rx="1.5" fill="#38bdf8" opacity="0.9"/>
  <rect x="22" y="22" width="10" height="3" rx="1.5" fill="#22c55e" opacity="0.9"/>

  <!-- 右侧指示灯和按钮 -->
  <circle cx="66" cy="18" r="3" fill="#22c55e"/>
  <circle cx="74" cy="18" r="3" fill="#eab308"/>
  <circle cx="66" cy="26" r="3" fill="#ef4444"/>
  <rect x="60" y="30" width="18" height="3" rx="1.5" fill="#94a3b8" opacity="0.9"/>

  <!-- 底部托盘阴影 -->
  <rect x="24" y="44" width="48" height="4" rx="2" fill="#cbd5e1" opacity="0.8"/>
</svg>

